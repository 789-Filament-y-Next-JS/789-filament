version: '3'


services:

  database:
    image: mysql

    container_name: 789-database

    environment:
      MYSQL_DATABASE: "789"
      
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "password"

      MYSQL_ROOT_PASSWORD: "password"
    
    ports:
      - 3307:3306

    volumes:
      - ./mysql:/var/lib/mysql


